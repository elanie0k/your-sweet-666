<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#5c1028">
<title>Legendary Couple's Style</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap');

:root{
    --burgundy:#64152f;
    --burgundy-dark:#300817;
    --burgundy-deep:#1b0610;
    --pink:#d89aaa;
    --pink-light:#f4cbd5;
    --pink-pale:#ffe8ee;
    --cream:#fff8f7;
    --gold:#d9b36c;
    --ink:#25131a;
}

*{
    box-sizing:border-box;
}

html,body{
    width:100%;
    min-height:100%;
    margin:0;
}

body{
    min-height:100vh;
    overflow-x:hidden;
    color:var(--cream);
    font-family:"DM Sans",sans-serif;
    background:
        radial-gradient(circle at 50% 0%, #7b2344 0%, transparent 40%),
        linear-gradient(135deg,#16040c,#421025 48%,#18050d);
}

/* =========================================================
   GLOBAL
========================================================= */

button,
input{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none !important;
}

.screen{
    min-height:100vh;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
}

/* decorative stars */
.star{
    position:absolute;
    color:#ffdfe7;
    opacity:.7;
    pointer-events:none;
    animation:twinkle 2.8s infinite ease-in-out;
}

.star:nth-child(2n){
    animation-delay:1s;
}

@keyframes twinkle{
    0%,100%{transform:scale(.7);opacity:.35}
    50%{transform:scale(1.15);opacity:1}
}

/* =========================================================
   PASSWORD SCREEN
========================================================= */

#passwordScreen{
    background:
        radial-gradient(circle at 50% 30%,rgba(188,70,105,.35),transparent 34%),
        radial-gradient(circle at 20% 80%,rgba(216,154,170,.12),transparent 25%),
        linear-gradient(145deg,#17050d,#54132d 55%,#1b0610);
}

.password-box{
    width:min(430px,90vw);
    padding:42px 34px 38px;
    border:1px solid rgba(244,203,213,.45);
    border-radius:28px;
    background:rgba(28,5,15,.75);
    box-shadow:
        0 30px 80px rgba(0,0,0,.45),
        inset 0 0 35px rgba(216,154,170,.08);
    text-align:center;
    backdrop-filter:blur(12px);
    position:relative;
    z-index:3;
}

.password-ornament{
    color:var(--gold);
    font-size:22px;
    letter-spacing:10px;
    margin-bottom:15px;
}

.game-title{
    margin:0;
    font-family:"Cinzel",serif;
    font-size:clamp(29px,7vw,48px);
    line-height:1.05;
    letter-spacing:1px;
    color:#fff3f5;
    text-shadow:0 4px 20px rgba(0,0,0,.5);
}

.game-title span{
    display:block;
    color:var(--pink);
    font-family:"Playfair Display",serif;
    font-style:italic;
}

.password-hint{
    margin:18px 0 24px;
    color:#eecbd3;
    font-size:15px;
}

.password-input{
    width:100%;
    height:58px;
    border-radius:15px;
    border:1px solid rgba(244,203,213,.35);
    outline:none;
    background:rgba(255,255,255,.06);
    color:white;
    text-align:center;
    font-size:28px;
    font-weight:700;
    letter-spacing:12px;
    padding-left:12px;
    transition:.2s;
}

.password-input:focus{
    border-color:var(--pink);
    box-shadow:0 0 0 4px rgba(216,154,170,.12);
}

.password-button,
.play-button,
.ready-button{
    border:0;
    color:white;
    background:linear-gradient(135deg,#8d294c,#5a102b);
    border-radius:15px;
    padding:14px 30px;
    font-weight:800;
    letter-spacing:1px;
    margin-top:18px;
    box-shadow:0 10px 30px rgba(73,8,32,.4);
    transition:.2s;
}

.password-button:hover,
.play-button:hover,
.ready-button:hover{
    transform:translateY(-2px);
    filter:brightness(1.12);
}

.password-error{
    min-height:22px;
    color:#ffb7c8;
    margin-top:13px;
    font-size:13px;
}

/* =========================================================
   PLAY SCREEN
========================================================= */

#playScreen{
    background:
        radial-gradient(circle at 50% 35%,rgba(255,169,193,.17),transparent 27%),
        linear-gradient(135deg,#1a0610,#5b1531,#250713);
}

.intro-card{
    text-align:center;
    position:relative;
    z-index:2;
    padding:30px;
}

.intro-small{
    font-family:"Cinzel",serif;
    letter-spacing:4px;
    color:#eab4c1;
    font-size:12px;
    margin-bottom:12px;
}

.intro-title{
    font-family:"Cinzel",serif;
    font-size:clamp(38px,9vw,75px);
    margin:0;
    line-height:1;
    color:#fff4f6;
    text-shadow:0 10px 40px rgba(0,0,0,.45);
}

.intro-title span{
    color:#e19bad;
}

.intro-characters{
    height:245px;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    gap:50px;
    margin:25px 0 8px;
}

.intro-vampire,
.intro-fairy{
    width:120px;
    height:190px;
    position:relative;
}

.mini-head{
    width:76px;
    height:76px;
    border-radius:50%;
    background:#f5d0bb;
    border:3px solid #2a1019;
    position:absolute;
    top:14px;
    left:22px;
    z-index:3;
}

.mini-eye{
    width:8px;
    height:11px;
    border-radius:50%;
    background:#4a251d;
    position:absolute;
    top:40px;
}

.mini-eye.left{left:18px}
.mini-eye.right{right:18px}

.mini-mouth{
    width:21px;
    height:9px;
    border-bottom:2px solid #642538;
    border-radius:50%;
    position:absolute;
    left:25px;
    top:57px;
}

.vamp-hair{
    position:absolute;
    width:86px;
    height:55px;
    left:17px;
    top:5px;
    border-radius:50px 50px 18px 18px;
    background:#171016;
    z-index:4;
}

.vamp-body{
    position:absolute;
    width:83px;
    height:85px;
    left:18px;
    top:88px;
    border-radius:28px 28px 15px 15px;
    background:#22101a;
}

.vamp-cape{
    position:absolute;
    width:112px;
    height:110px;
    left:4px;
    top:82px;
    background:#53132b;
    clip-path:polygon(20% 0,80% 0,100% 100%,50% 75%,0 100%);
}

.fairy-wings{
    position:absolute;
    top:82px;
    left:4px;
    width:112px;
    height:90px;
}

.fairy-wings:before,
.fairy-wings:after{
    content:"";
    position:absolute;
    width:48px;
    height:70px;
    border:2px solid #f4b8ca;
    background:rgba(244,184,202,.28);
    border-radius:70% 30% 70% 30%;
}

.fairy-wings:before{
    left:0;
    transform:rotate(-20deg);
}

.fairy-wings:after{
    right:0;
    transform:scaleX(-1) rotate(-20deg);
}

.fairy-dress{
    position:absolute;
    width:75px;
    height:85px;
    left:22px;
    top:88px;
    background:#d986a1;
    clip-path:polygon(35% 0,65% 0,100% 100%,0 100%);
}

.play-button{
    font-family:"Cinzel",serif;
    font-size:20px;
    padding:16px 55px;
}

/* =========================================================
   GAME SCREEN
========================================================= */

#gameScreen{
    display:block;
    min-height:100vh;
    background:#1a0710;
}

.topbar{
    height:76px;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 24px;
    position:absolute;
    top:0;
    left:0;
    z-index:50;
    background:linear-gradient(to bottom,rgba(20,3,10,.8),transparent);
}

.top-logo{
    font-family:"Cinzel",serif;
    font-size:16px;
    letter-spacing:2px;
    color:#f3ccd5;
}

.play-again{
    border:1px solid rgba(255,220,228,.35);
    color:#ffeef2;
    background:rgba(70,10,29,.7);
    border-radius:12px;
    padding:9px 15px;
    font-size:13px;
    font-weight:700;
    transition:.2s;
}

.play-again:hover{
    background:#7c2044;
}

.game-layout{
    width:100%;
    min-height:100vh;
    padding:80px 20px 28px;
    display:flex;
    flex-direction:column;
    align-items:center;
}

.stage{
    width:min(1180px,96vw);
    height:470px;
    border-radius:30px;
    position:relative;
    overflow:hidden;
    border:1px solid rgba(255,221,229,.35);
    box-shadow:
        0 30px 70px rgba(0,0,0,.45),
        inset 0 0 80px rgba(0,0,0,.35);
    transition:.8s;
}

/* =========================================================
   BACKGROUNDS
========================================================= */

.background-art{
    position:absolute;
    inset:0;
    overflow:hidden;
    transition:background .5s;
}

.bg-castle{
    background:
        radial-gradient(circle at 75% 18%,#f4d4bd 0 30px,rgba(244,212,189,.15) 31px,transparent 95px),
        linear-gradient(to bottom,#140712 0%,#361126 58%,#160711 100%);
}

.bg-castle:before{
    content:"";
    position:absolute;
    left:7%;
    bottom:0;
    width:86%;
    height:230px;
    background:
        linear-gradient(90deg,
        transparent 0 4%,
        #160711 4% 20%,
        transparent 20% 24%,
        #160711 24% 39%,
        transparent 39% 43%,
        #160711 43% 62%,
        transparent 62% 67%,
        #160711 67% 84%,
        transparent 84% 88%,
        #160711 88%);
    clip-path:polygon(
        0 35%, 8% 35%, 8% 8%,14% 8%,14% 35%,
        24% 35%,24% 18%,30% 18%,30% 35%,
        40% 35%,40% 0,47% 0,47% 35%,
        57% 35%,57% 13%,63% 13%,63% 35%,
        73% 35%,73% 4%,80% 4%,80% 35%,
        91% 35%,91% 15%,97% 15%,97% 35%,100% 35%,
        100% 100%,0 100%);
}

.bg-castle:after{
    content:"✦  ✧  ✦  ·  ✧  ✦";
    position:absolute;
    top:32px;
    left:10%;
    right:10%;
    text-align:center;
    color:#f2cbd5;
    letter-spacing:32px;
    opacity:.55;
}

.bg-saturn{
    background:
        radial-gradient(circle at 50% 42%,#ead5c4 0 38px,#b58b7b 39px 50px,#503342 51px,transparent 53px),
        radial-gradient(circle at 20% 25%,#fff 0 1px,transparent 2px),
        radial-gradient(circle at 78% 18%,#fff 0 1px,transparent 2px),
        radial-gradient(circle at 62% 75%,#fff 0 1px,transparent 2px),
        radial-gradient(circle at 12% 72%,#fff 0 1px,transparent 2px),
        radial-gradient(circle at 90% 58%,#fff 0 1px,transparent 2px),
        radial-gradient(circle at 35% 12%,#fff 0 1px,transparent 2px),
        linear-gradient(135deg,#050817,#130d2b 50%,#05030c);
}

.bg-saturn:before{
    content:"";
    position:absolute;
    width:220px;
    height:58px;
    border:8px solid rgba(216,173,158,.65);
    border-left-color:rgba(216,173,158,.25);
    border-right-color:rgba(216,173,158,.25);
    border-radius:50%;
    left:calc(50% - 110px);
    top:calc(42% - 29px);
    transform:rotate(-13deg);
}

.bg-saturn:after{
    content:"✦   ·    ✧      ·     ✦       ·";
    position:absolute;
    inset:0;
    color:#fff;
    opacity:.7;
    font-size:14px;
    word-spacing:35px;
}

.bg-bedroom{
    background:
        linear-gradient(to bottom,#1c0e18 0 57%,#321622 57% 100%);
}

.bg-bedroom:before{
    content:"";
    position:absolute;
    width:170px;
    height:100px;
    left:calc(50% - 85px);
    top:55px;
    border:6px solid #5d3343;
    background:#160c15;
    box-shadow:inset 0 0 30px #090509;
}

.bg-bedroom:after{
    content:"";
    position:absolute;
    width:340px;
    height:120px;
    left:calc(50% - 170px);
    bottom:35px;
    border-radius:35px 35px 8px 8px;
    background:
        linear-gradient(to bottom,#754457 0 35%,#4b2737 35%);
    box-shadow:0 -8px 0 #9d6074;
}

.bg-concert{
    background:
        radial-gradient(circle at 20% 0%,rgba(238,148,180,.4),transparent 25%),
        radial-gradient(circle at 80% 0%,rgba(166,119,224,.35),transparent 25%),
        linear-gradient(to bottom,#130612 0%,#270d28 65%,#070207 100%);
}

.bg-concert:before{
    content:"";
    position:absolute;
    left:14%;
    top:-40px;
    width:90px;
    height:360px;
    background:linear-gradient(to bottom,rgba(244,184,202,.45),transparent);
    transform:rotate(17deg);
    filter:blur(5px);
    box-shadow:
        480px 0 0 rgba(188,146,238,.25),
        230px 0 0 rgba(255,190,211,.2);
}

.bg-concert:after{
    content:"";
    position:absolute;
    bottom:0;
    left:0;
    right:0;
    height:100px;
    background:
        radial-gradient(circle at 10% 60%,#080308 0 25px,transparent 26px),
        radial-gradient(circle at 25% 45%,#080308 0 28px,transparent 29px),
        radial-gradient(circle at 42% 65%,#080308 0 24px,transparent 25px),
        radial-gradient(circle at 58% 45%,#080308 0 27px,transparent 28px),
        radial-gradient(circle at 75% 60%,#080308 0 25px,transparent 26px),
        radial-gradient(circle at 91% 45%,#080308 0 28px,transparent 29px);
}

/* =========================================================
   CHARACTERS
========================================================= */

.characters{
    position:absolute;
    inset:0;
    z-index:10;
    display:flex;
    justify-content:center;
    align-items:flex-end;
    gap:clamp(75px,10vw,135px);
    padding:10px 40px 12px;
    transition:.8s;
}

.character{
    width:220px;
    height:420px;
    position:relative;
    flex:0 0 220px;
    transition:.8s cubic-bezier(.2,.8,.2,1);
    filter:drop-shadow(0 18px 18px rgba(0,0,0,.28));
}

/*
   IMPORTANT:
   Each SVG is 100% FRONT-FACING.
   Every body part is explicitly drawn.
   Hair is behind the face and cannot cover the eyes.
*/

.character svg{
    width:100%;
    height:100%;
    overflow:visible;
    display:block;
}

/* Base anatomy */
.skin{
    fill:#f1cfb9;
}

.skin-shadow{
    fill:#dfae99;
}

.eye-white{
    fill:#fffaf9;
}

.eye-brown{
    fill:#5a3428;
}

.eye-highlight{
    fill:#fff;
}

.blush{
    fill:#e89aaa;
    opacity:.58;
}

.hair-male{
    fill:#21171a;
}

.hair-female{
    fill:#65182b;
}

.mouth{
    fill:none;
    stroke:#63283a;
    stroke-width:3;
    stroke-linecap:round;
}

.neck{
    fill:#e7bba6;
}

.arm-skin{
    fill:#f1cfb9;
}

.hand-skin{
    fill:#f1cfb9;
}

.leg-skin{
    fill:#efc9b3;
}

.shoe-black{
    fill:#171419;
}

.shoe-white{
    fill:#f5f2ef;
}

.default-shorts{
    fill:#4b1730;
}

.default-shorts-detail{
    fill:#702744;
}

/* Hair ALWAYS behind face */
.hair-back{
    z-index:1;
}

.face-group{
    z-index:5;
}

/* Clothes */
.clothing{
    display:none;
}

/* outfit classes */
.character.outfit-1 .outfit-1,
.character.outfit-2 .outfit-2,
.character.outfit-3 .outfit-3,
.character.outfit-4 .outfit-4{
    display:block;
}

/* Outfit 1 male/female */
.black-shirt{
    fill:#111013;
}

.brown-shirt{
    fill:#39251f;
}

.black-pants{
    fill:#111013;
}

.vampire-white{
    fill:#f5eee8;
}

.vampire-red{
    fill:#7d1837;
}

.vampire-black{
    fill:#170d15;
}

.vampire-gold{
    fill:#d8ae64;
}

.pajama-pink{
    fill:#e5a1b4;
}

.pajama-dark{
    fill:#761a39;
}

.fairy-pink{
    fill:#df91aa;
}

.fairy-light{
    fill:#f7c5d4;
}

.fairy-wing{
    fill:#f6c3d2;
    opacity:.5;
    stroke:#fff0f5;
    stroke-width:2;
}

/* Shirt labels */
.shirt-label{
    fill:#fff;
    font-family:Arial,Helvetica,sans-serif;
    font-weight:900;
    text-anchor:middle;
    letter-spacing:1.2px;
}

.shirt-label.deftones{
    font-size:13px;
}

.shirt-label.opeth{
    font-family:Georgia,serif;
    font-style:italic;
    font-size:15px;
    letter-spacing:.7px;
}

/* hands holding */
.holding-hand{
    transform-origin:center;
}

/* =========================================================
   OUTFIT AREA
========================================================= */

.controls{
    width:min(1180px,96vw);
    margin-top:20px;
    position:relative;
    z-index:30;
}

.selector-title{
    font-family:"Cinzel",serif;
    text-align:center;
    font-size:18px;
    letter-spacing:1px;
    margin:10px 0 13px;
    color:#ffe7ed;
}

.selector-title span{
    color:#d88fa3;
}

.outfit-sections{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.outfit-group{
    background:rgba(36,8,20,.75);
    border:1px solid rgba(255,216,226,.2);
    border-radius:22px;
    padding:15px;
    backdrop-filter:blur(8px);
}

.outfit-group h3{
    margin:0 0 12px;
    text-align:center;
    color:#f3c7d1;
    font-family:"Cinzel",serif;
    font-size:14px;
}

.outfit-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

.outfit-card{
    min-height:132px;
    border:1px solid rgba(255,220,229,.16);
    background:rgba(255,255,255,.045);
    border-radius:15px;
    color:white;
    padding:8px 5px;
    transition:.2s;
    text-align:center;
}

.outfit-card:hover{
    transform:translateY(-3px);
    border-color:rgba(230,153,174,.7);
}

.outfit-card.selected{
    border:2px solid #e5a0b2;
    background:rgba(159,45,76,.3);
    box-shadow:0 0 18px rgba(219,135,158,.15);
}

.outfit-preview{
    height:68px;
    position:relative;
    display:flex;
    justify-content:center;
    align-items:flex-end;
    margin-bottom:6px;
}

/* little fashion preview */
.preview-person{
    width:38px;
    height:58px;
    position:relative;
}

.preview-head{
    position:absolute;
    width:22px;
    height:22px;
    border-radius:50%;
    background:#efcbb8;
    left:8px;
    top:0;
}

.preview-hair{
    position:absolute;
    width:25px;
    height:17px;
    border-radius:50% 50% 40% 40%;
    left:6px;
    top:-2px;
    background:#26181c;
    z-index:2;
}

.preview-body{
    position:absolute;
    width:25px;
    height:23px;
    left:6px;
    top:21px;
    border-radius:7px 7px 2px 2px;
}

.preview-bottom{
    position:absolute;
    width:27px;
    height:15px;
    left:5px;
    top:43px;
    border-radius:2px 2px 6px 6px;
}

.preview-shoes{
    position:absolute;
    left:4px;
    top:54px;
    width:30px;
    height:5px;
    border-radius:8px;
    background:#171419;
}

.preview-vamp .preview-body{background:#7d1837}
.preview-vamp .preview-bottom{background:#171019}

.preview-fairy .preview-body{
    background:#df91aa;
    border-radius:5px 5px 15px 15px;
}

.preview-fairy .preview-bottom{
    background:#f4bdd0;
    border-radius:50%;
}

.preview-pajama .preview-body{background:#e5a1b4}
.preview-pajama .preview-bottom{background:#e5a1b4}

.preview-black .preview-body{background:#121114}
.preview-black .preview-bottom{background:#121114}

.preview-brown .preview-body{background:#39251f}
.preview-white .preview-bottom{background:#f4eee9}

.outfit-name{
    font-size:10px;
    line-height:1.2;
    color:#f8e7eb;
    font-weight:700;
}

.outfit-sub{
    margin-top:3px;
    color:#cfaeb7;
    font-size:8px;
}

/* Background selector */
.background-panel{
    margin-top:18px;
    background:rgba(36,8,20,.8);
    border:1px solid rgba(255,216,226,.2);
    border-radius:22px;
    padding:16px;
}

.background-title{
    text-align:center;
    margin:0 0 12px;
    font-family:"Cinzel",serif;
    color:#f6cbd5;
    font-size:15px;
}

.background-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

.background-card{
    border:1px solid rgba(255,220,229,.16);
    background:rgba(255,255,255,.04);
    color:white;
    border-radius:14px;
    padding:0;
    overflow:hidden;
    transition:.2s;
}

.background-card:hover{
    transform:translateY(-3px);
}

.background-card.selected{
    border:2px solid #e3a0b2;
    box-shadow:0 0 20px rgba(227,160,178,.18);
}

.bg-thumb{
    height:78px;
    position:relative;
    overflow:hidden;
}

.bg-thumb.castle{
    background:
        radial-gradient(circle at 75% 25%,#efd3bd 0 11px,transparent 12px),
        linear-gradient(#180713,#531c37);
}

.bg-thumb.castle:after{
    content:"♜ ♜ ♜";
    position:absolute;
    bottom:0;
    left:0;
    right:0;
    color:#10040b;
    font-size:35px;
    text-align:center;
}

.bg-thumb.saturn{
    background:radial-gradient(circle at 50% 50%,#c8a394 0 14px,#47304a 15px,transparent 18px),#080817;
}

.bg-thumb.saturn:after{
    content:"";
    position:absolute;
    width:65px;
    height:20px;
    border:4px solid #bd998d;
    border-radius:50%;
    left:calc(50% - 32px);
    top:29px;
    transform:rotate(-15deg);
}

.bg-thumb.bedroom{
    background:linear-gradient(#1c0d17 0 55%,#4b2738 55%);
}

.bg-thumb.bedroom:after{
    content:"";
    position:absolute;
    width:80px;
    height:32px;
    bottom:8px;
    left:calc(50% - 40px);
    border-radius:12px;
    background:#704253;
}

.bg-thumb.concert{
    background:linear-gradient(#130612,#3b163b);
}

.bg-thumb.concert:before{
    content:"";
    position:absolute;
    width:25px;
    height:80px;
    left:25px;
    top:-10px;
    background:rgba(250,187,207,.35);
    transform:rotate(15deg);
    box-shadow:70px 0 0 rgba(191,157,240,.25);
}

.bg-name{
    padding:8px 4px;
    font-size:11px;
    font-weight:700;
}

/* Ready */
.ready-wrap{
    display:flex;
    justify-content:center;
    padding:18px 0 0;
}

.ready-button{
    font-family:"Cinzel",serif;
    font-size:17px;
    padding:14px 46px;
    margin:0;
}

.ready-button:disabled{
    opacity:.35;
    cursor:not-allowed;
    transform:none;
}

/* =========================================================
   FINAL MODE
========================================================= */

.stage.final-mode .characters{
    transform:scale(1.09) translateY(12px);
}

.stage.final-mode .character{
    transition:1s cubic-bezier(.2,.8,.2,1);
}

.stage.final-mode .characters{
    gap:clamp(55px,7vw,100px);
}

.celebration{
    position:absolute;
    inset:0;
    z-index:25;
    pointer-events:none;
    display:flex;
    align-items:center;
    justify-content:center;
}

.celebration-message{
    position:absolute;
    top:42%;
    transform:translateY(-50%);
    text-align:center;
    font-family:"Cinzel",serif;
    font-size:clamp(20px,4vw,37px);
    color:#fff4f6;
    text-shadow:0 5px 25px #000;
    opacity:0;
    animation:messageIn 1s .8s forwards;
    white-space:nowrap;
}

.celebration-message span{
    display:block;
    color:#efb1c2;
    font-family:"Playfair Display",serif;
    font-style:italic;
    font-size:.55em;
    margin-top:7px;
}

@keyframes messageIn{
    from{
        opacity:0;
        transform:translateY(-50%) scale(.7);
    }
    to{
        opacity:1;
        transform:translateY(-50%) scale(1);
    }
}

.big-heart{
    width:75px;
    height:75px;
    position:absolute;
    top:43%;
    left:50%;
    transform:translate(-50%,-50%) rotate(-45deg);
    background:#ed91ab;
    animation:heartBurst 1.7s .15s forwards;
    box-shadow:0 0 45px rgba(255,153,180,.8);
}

.big-heart:before,
.big-heart:after{
    content:"";
    position:absolute;
    width:75px;
    height:75px;
    background:#ed91ab;
    border-radius:50%;
}

.big-heart:before{
    top:-37px;
    left:0;
}

.big-heart:after{
    left:37px;
    top:0;
}

@keyframes heartBurst{
    0%{
        transform:translate(-50%,-50%) rotate(-45deg) scale(.15);
        opacity:0;
    }
    35%{
        transform:translate(-50%,-50%) rotate(-45deg) scale(1.25);
        opacity:1;
    }
    60%{
        transform:translate(-50%,-50%) rotate(-45deg) scale(1);
        opacity:1;
    }
    100%{
        transform:translate(-50%,-50%) rotate(-45deg) scale(2.7);
        opacity:0;
    }
}

.heart-rays{
    position:absolute;
    width:180px;
    height:180px;
    top:calc(43% - 90px);
    left:calc(50% - 90px);
    border-radius:50%;
    border:2px solid rgba(255,213,224,.8);
    animation:rays 1.5s .35s forwards;
    opacity:0;
}

@keyframes rays{
    0%{transform:scale(.1);opacity:0}
    25%{opacity:1}
    100%{transform:scale(2);opacity:0}
}

/* Confetti */
.confetti-container{
    position:absolute;
    inset:0;
    overflow:hidden;
    z-index:30;
    pointer-events:none;
}

.confetti{
    position:absolute;
    top:-20px;
    width:8px;
    height:13px;
    border-radius:2px;
    animation:confettiFall var(--duration) var(--delay) linear forwards;
    transform:rotate(var(--rotation));
}

@keyframes confettiFall{
    to{
        top:110%;
        transform:translateX(var(--drift)) rotate(720deg);
    }
}

<script>
/* =========================================================
   GAME STATE
========================================================= */

const state = {
    burakOutfit: null,
    elanieOutfit: null,
    background: null,
    finished: false
};


/* =========================================================
   SCREEN ELEMENTS
========================================================= */

const passwordScreen = document.getElementById("passwordScreen");
const playScreen = document.getElementById("playScreen");
const gameScreen = document.getElementById("gameScreen");

const passwordInput = document.getElementById("passwordInput");
const passwordButton = document.getElementById("passwordButton");
const passwordError = document.getElementById("passwordError");

const playButton = document.getElementById("playButton");
const playAgain = document.getElementById("playAgain");

const burak = document.getElementById("burak");
const elanie = document.getElementById("elanie");

const controls = document.getElementById("controls");
const backgroundPanel = document.getElementById("backgroundPanel");
const readyWrap = document.getElementById("readyWrap");

const backgroundArt = document.getElementById("backgroundArt");
const stage = document.getElementById("stage");

const celebration = document.getElementById("celebration");
const confettiContainer = document.getElementById("confettiContainer");


/* =========================================================
   PASSWORD
========================================================= */

function checkPassword(){

    if(passwordInput.value === "666"){

        passwordError.textContent = "";

        passwordScreen.classList.add("hidden");
        playScreen.classList.remove("hidden");

    }else{

        passwordError.textContent = "Wrong password ♡ Try again.";

        passwordInput.value = "";

        passwordInput.animate(
            [
                {transform:"translateX(0)"},
                {transform:"translateX(-8px)"},
                {transform:"translateX(8px)"},
                {transform:"translateX(-5px)"},
                {transform:"translateX(0)"}
            ],
            {
                duration:300
            }
        );
    }
}

passwordButton.addEventListener("click",checkPassword);

passwordInput.addEventListener("keydown",(event)=>{
    if(event.key === "Enter"){
        checkPassword();
    }
});

passwordInput.addEventListener("input",()=>{
    passwordInput.value = passwordInput.value.replace(/\D/g,"");
});


/* =========================================================
   PLAY
========================================================= */

playButton.addEventListener("click",()=>{

    playScreen.classList.add("hidden");
    gameScreen.classList.remove("hidden");

    window.scrollTo({
        top:0,
        behavior:"instant"
    });
});


/* =========================================================
   OUTFIT SELECTION
========================================================= */

document.querySelectorAll(".outfit-card").forEach(card=>{

    card.addEventListener("click",()=>{

        const characterName = card.dataset.character;
        const outfitNumber = card.dataset.outfit;

        const character =
            characterName === "burak"
            ? burak
            : elanie;

        /* remove previous outfit */
        character.classList.remove(
            "outfit-1",
            "outfit-2",
            "outfit-3",
            "outfit-4"
        );

        /* add selected outfit */
        character.classList.add(`outfit-${outfitNumber}`);

        /* selected card */
        document
            .querySelectorAll(
                `.outfit-card[data-character="${characterName}"]`
            )
            .forEach(item=>{
                item.classList.remove("selected");
            });

        card.classList.add("selected");

        /* state */
        if(characterName === "burak"){
            state.burakOutfit = outfitNumber;
        }else{
            state.elanieOutfit = outfitNumber;
        }

        checkOutfitCompletion();
    });

});


/* =========================================================
   AFTER BOTH OUTFITS
========================================================= */

function checkOutfitCompletion(){

    if(
        state.burakOutfit !== null &&
        state.elanieOutfit !== null
    ){

        backgroundPanel.classList.remove("hidden");

        backgroundPanel.scrollIntoView({
            behavior:"smooth",
            block:"center"
        });
    }
}


/* =========================================================
   BACKGROUND SELECTION
========================================================= */

document.querySelectorAll(".background-card").forEach(card=>{

    card.addEventListener("click",()=>{

        const selectedBackground = card.dataset.background;

        state.background = selectedBackground;

        backgroundArt.className =
            "background-art bg-" + selectedBackground;

        document
            .querySelectorAll(".background-card")
            .forEach(item=>{
                item.classList.remove("selected");
            });

        card.classList.add("selected");

        readyWrap.classList.remove("hidden");

        readyWrap.scrollIntoView({
            behavior:"smooth",
            block:"center"
        });
    });

});


/* =========================================================
   READY
========================================================= */

document.getElementById("readyButton").addEventListener("click",()=>{

    if(
        !state.burakOutfit ||
        !state.elanieOutfit ||
        !state.background
    ){
        return;
    }

    state.finished = true;

    /* hide all controls */
    controls.classList.add("hidden");

    /* final stage */
    stage.classList.add("final-mode");

    /* celebration */
    celebration.classList.remove("hidden");

    createConfetti();

    /* remove celebration after animation */
    setTimeout(()=>{

        celebration.classList.add("hidden");

    },4700);

});


/* =========================================================
   CONFETTI
========================================================= */

function createConfetti(){

    confettiContainer.innerHTML = "";

    const symbols = [
        "♥",
        "✦",
        "✧",
        "◆",
        "♡"
    ];

    for(let i=0;i<90;i++){

        const piece = document.createElement("div");

        piece.className = "confetti";

        piece.textContent =
            symbols[Math.floor(Math.random()*symbols.length)];

        piece.style.left =
            Math.random()*100 + "%";

        piece.style.fontSize =
            (7 + Math.random()*10) + "px";

        piece.style.color =
            [
                "#f3b6c6",
                "#f8e2e8",
                "#c9859c",
                "#d9b36c",
                "#ffffff"
            ][Math.floor(Math.random()*5)];

        piece.style.setProperty(
            "--duration",
            (2.5 + Math.random()*3) + "s"
        );

        piece.style.setProperty(
            "--delay",
            (Math.random()*1.2) + "s"
        );

        piece.style.setProperty(
            "--rotation",
            (Math.random()*360) + "deg"
        );

        piece.style.setProperty(
            "--drift",
            (-150 + Math.random()*300) + "px"
        );

        confettiContainer.appendChild(piece);
    }
}


/* =========================================================
   PLAY AGAIN
========================================================= */

playAgain.addEventListener("click",()=>{

    /* reset state */
    state.burakOutfit = null;
    state.elanieOutfit = null;
    state.background = null;
    state.finished = false;

    /* reset character classes */
    burak.classList.remove(
        "outfit-1",
        "outfit-2",
        "outfit-3",
        "outfit-4"
    );

    elanie.classList.remove(
        "outfit-1",
        "outfit-2",
        "outfit-3",
        "outfit-4"
    );

    /* reset selected cards */
    document
        .querySelectorAll(".outfit-card,.background-card")
        .forEach(card=>{
            card.classList.remove("selected");
        });

    /* reset background */
    backgroundArt.className =
        "background-art bg-castle";

    /* reset UI */
    backgroundPanel.classList.add("hidden");
    readyWrap.classList.add("hidden");
    celebration.classList.add("hidden");
    controls.classList.remove("hidden");
    stage.classList.remove("final-mode");

    confettiContainer.innerHTML = "";

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

});


/* =========================================================
   INITIAL FOCUS
========================================================= */

window.addEventListener("load",()=>{

    setTimeout(()=>{
        passwordInput.focus();
    },300);

});
</script>
