<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Legendary Couple's Style</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  font-family:Georgia,"Times New Roman",serif;
  overflow-x:hidden;
  background:
    radial-gradient(circle at 50% 20%,#64233d 0%,#2a0c1b 45%,#110611 100%);
  color:#ffe8ef;
}

button{
  font:inherit;
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* ---------------- PASSWORD ---------------- */

#passwordScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.password-box{
  width:min(440px,92vw);
  padding:42px 32px;
  text-align:center;
  border:1px solid rgba(255,185,205,.55);
  border-radius:24px;
  background:rgba(45,8,27,.82);
  box-shadow:
    0 0 45px rgba(255,95,145,.18),
    inset 0 0 35px rgba(255,160,190,.05);
  backdrop-filter:blur(12px);
}

.password-box h1{
  font-size:clamp(32px,7vw,55px);
  color:#ffd8e4;
  text-shadow:0 0 18px #d65b83;
  margin-bottom:12px;
}

.password-box p{
  color:#eeb3c6;
  margin-bottom:25px;
}

.password-input{
  width:100%;
  padding:15px;
  border:1px solid #b85a7b;
  border-radius:13px;
  outline:none;
  background:#1b0711;
  color:white;
  text-align:center;
  letter-spacing:10px;
  font-size:25px;
}

.enter-btn,
.main-btn{
  margin-top:18px;
  border:1px solid #e68ca9;
  color:#fff0f5;
  background:linear-gradient(135deg,#8d274d,#54132d);
  padding:13px 28px;
  border-radius:999px;
  box-shadow:0 0 20px rgba(230,110,150,.2);
  transition:.2s;
}

.enter-btn:hover,
.main-btn:hover{
  transform:translateY(-2px) scale(1.02);
  box-shadow:0 0 28px rgba(255,120,160,.4);
}

.error{
  height:20px;
  margin-top:12px;
  color:#ff8eae;
}

/* ---------------- INTRO ---------------- */

#introScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
}

.intro-content{
  text-align:center;
  position:relative;
  z-index:2;
}

.intro-title{
  font-size:clamp(42px,9vw,90px);
  color:#ffd6e3;
  text-shadow:
    0 0 12px #ef759e,
    0 0 40px rgba(239,117,158,.5);
  font-style:italic;
}

.intro-sub{
  color:#d99bad;
  margin:10px 0 28px;
  letter-spacing:4px;
  text-transform:uppercase;
  font-size:13px;
}

.intro-characters{
  display:flex;
  justify-content:center;
  align-items:end;
  gap:50px;
  margin-bottom:20px;
}

.intro-vampire,
.intro-fairy{
  width:90px;
  height:130px;
  position:relative;
}

.intro-vampire .head,
.intro-fairy .head{
  position:absolute;
  width:65px;
  height:65px;
  left:12px;
  top:15px;
  border-radius:50%;
  background:#f0c79f;
  border:2px solid #421021;
}

.intro-vampire .hair{
  position:absolute;
  width:76px;
  height:58px;
  left:6px;
  top:3px;
  border-radius:50% 50% 40% 40%;
  background:#21121c;
}

.intro-fairy .hair{
  position:absolute;
  width:78px;
  height:60px;
  left:5px;
  top:4px;
  border-radius:50% 50% 40% 40%;
  background:#7f2442;
}

.intro-vampire .body,
.intro-fairy .body{
  position:absolute;
  width:62px;
  height:58px;
  left:15px;
  top:75px;
  border-radius:25px 25px 8px 8px;
}

.intro-vampire .body{
  background:#190912;
  border:2px solid #a9486d;
}

.intro-fairy .body{
  background:#e986ac;
  border:2px solid #ffd0df;
}

.intro-vampire:after{
  content:"";
  position:absolute;
  left:42px;
  top:49px;
  width:8px;
  height:8px;
  border-radius:50%;
  background:#4d1728;
  box-shadow:-17px 0 #4d1728,17px 0 #4d1728;
}

.intro-fairy:after{
  content:"✦";
  position:absolute;
  color:#ffd6e7;
  font-size:30px;
  left:-8px;
  top:30px;
  text-shadow:0 0 15px #fff;
}

/* ---------------- GAME ---------------- */

#gameScreen{
  min-height:100vh;
  padding:18px 18px 35px;
}

.game-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:12px;
}

.logo{
  font-size:clamp(25px,5vw,43px);
  font-style:italic;
  color:#ffd4e1;
  text-shadow:0 0 18px rgba(255,110,155,.6);
}

.play-again{
  border:1px solid #a64a6c;
  background:#260b18;
  color:#f7c8d7;
  padding:9px 15px;
  border-radius:999px;
}

.game-area{
  max-width:1200px;
  margin:auto;
}

.stage{
  position:relative;
  min-height:510px;
  border-radius:30px;
  border:1px solid rgba(255,180,205,.38);
  overflow:hidden;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  gap:70px;
  padding:25px 40px 5px;
  background:
    radial-gradient(circle at 50% 20%,rgba(255,170,195,.16),transparent 45%),
    linear-gradient(145deg,#351020,#160711);
  box-shadow:
    inset 0 0 70px rgba(0,0,0,.5),
    0 0 35px rgba(255,80,140,.1);
  transition:.6s;
}

/* BACKGROUNDS */

.stage.castle{
  background:
    linear-gradient(rgba(15,4,12,.38),rgba(15,4,12,.65)),
    radial-gradient(circle at 50% 12%,#9d355b 0%,#3b1124 35%,#08040a 100%);
}

.stage.saturn{
  background:
    radial-gradient(circle at 70% 25%,#d08e64 0 5%,transparent 6%),
    radial-gradient(circle at 70% 25%,transparent 0 11%,rgba(238,194,151,.65) 11.5% 12.5%,transparent 13%),
    radial-gradient(circle at 20% 20%,#fff 0 1px,transparent 2px),
    radial-gradient(circle at 35% 60%,#fff 0 1px,transparent 2px),
    radial-gradient(circle at 85% 70%,#fff 0 1px,transparent 2px),
    radial-gradient(circle at 50% 80%,#fff 0 1px,transparent 2px),
    #090914;
}

.stage.bedroom{
  background:
    linear-gradient(rgba(30,8,25,.25),rgba(10,3,12,.7)),
    radial-gradient(circle at 50% 20%,#653044,#281225 60%,#10060f);
}

.stage.concert{
  background:
    radial-gradient(circle at 20% 30%,#ff3e86 0 2%,transparent 18%),
    radial-gradient(circle at 80% 25%,#8c4dff 0 2%,transparent 18%),
    radial-gradient(circle at 50% 15%,#fff 0 1%,transparent 9%),
    linear-gradient(#18061b,#08030c 70%);
}

.stage.castle:after{
  content:"♜     ♜     ♜";
  position:absolute;
  top:35px;
  left:50%;
  transform:translateX(-50%);
  font-size:70px;
  color:rgba(255,202,217,.16);
  white-space:nowrap;
}

.stage.saturn:after{
  content:"SATURN";
  position:absolute;
  top:30px;
  left:50%;
  transform:translateX(-50%);
  color:rgba(255,215,187,.3);
  font-size:28px;
  letter-spacing:8px;
}

.stage.bedroom:after{
  content:"";
  position:absolute;
  left:8%;
  right:8%;
  bottom:0;
  height:42%;
  background:
    linear-gradient(90deg,transparent 0 8%,rgba(255,160,190,.08) 8% 30%,transparent 30% 70%,rgba(255,160,190,.08) 70% 92%,transparent 92%);
  border-top:1px solid rgba(255,180,200,.12);
}

.stage.concert:after{
  content:"♫     ♫     ♫";
  position:absolute;
  top:25px;
  left:50%;
  transform:translateX(-50%);
  color:rgba(255,210,230,.2);
  font-size:48px;
  white-space:nowrap;
}

/* ---------------- CHARACTERS ---------------- */

.character{
  position:relative;
  width:250px;
  height:485px;
  flex:0 0 250px;
  z-index:3;
  transition:.7s ease;
}

.character svg{
  width:100%;
  height:100%;
  overflow:visible;
  display:block;
}

/* outfit visibility */

.character .outfit{
  display:none;
}

.character.outfit1 .outfit-1,
.character.outfit2 .outfit-2,
.character.outfit3 .outfit-3,
.character.outfit4 .outfit-4{
  display:block;
}

.character.outfit1 .default-shorts,
.character.outfit2 .default-shorts,
.character.outfit3 .default-shorts,
.character.outfit4 .default-shorts{
  display:none;
}

/* background layer */

.character .skin{
  fill:#f1c9a4;
  stroke:#512536;
  stroke-width:2;
}

.character .hair-back{
  fill:#24161c;
}

#elanie .hair-back,
#elanie .hair-front{
  fill:#76213d;
}

/* face */

.eye-white{
  fill:#fffafc;
  stroke:#4b2632;
  stroke-width:2;
}

.eye-pupil{
  fill:#5b321f;
}

.eye-shine{
  fill:#fff;
}

.mouth{
  fill:none;
  stroke:#7a3148;
  stroke-width:3;
  stroke-linecap:round;
}

.blush{
  fill:#ed829b;
  opacity:.35;
}

.brow{
  fill:none;
  stroke:#4b2930;
  stroke-width:4;
  stroke-linecap:round;
}

/* Hair deliberately stays outside face */

.hair-front{
  fill:#24161c;
}

.hair-side{
  fill:#24161c;
}

/* ---------------- OUTFITS ---------------- */

/* BURAK 1 */

#burak .b1-shirt{
  fill:#0e0d10;
}

#burak .b1-pants{
  fill:#111116;
}

#burak .b1-shoe{
  fill:#09090b;
}

#burak .b1-text{
  fill:white;
  font-family:Arial,sans-serif;
  font-weight:700;
  letter-spacing:2px;
  font-size:15px;
}

/* BURAK 2 */

#burak .b2-shirt{
  fill:#39261f;
}

#burak .b2-pants{
  fill:#111116;
}

#burak .b2-shoe{
  fill:#09090b;
}

#burak .b2-text{
  fill:#fff;
  font-family:Georgia,serif;
  font-weight:bold;
  letter-spacing:2px;
  font-size:14px;
}

/* BURAK 3 vampire */

.vampire-coat{
  fill:#21101a;
  stroke:#9c3b5f;
  stroke-width:2;
}

.vampire-shirt{
  fill:#eee0e5;
}

.vampire-pants{
  fill:#111116;
}

.vampire-shoe{
  fill:#08080a;
}

.vampire-cape{
  fill:#651633;
  opacity:.95;
}

/* BURAK 4 pajamas */

.pajama{
  fill:#ef9bb9;
  stroke:#7c2947;
  stroke-width:2;
}

.pajama-heart{
  fill:#7e2143;
}

/* ELANIE */

#elanie .e1-shirt{
  fill:#0e0d10;
}

#elanie .e1-skirt{
  fill:#111116;
}

#elanie .e1-shoe{
  fill:#09090b;
}

#elanie .e1-text{
  fill:#fff;
  font-family:Arial,sans-serif;
  font-weight:700;
  letter-spacing:2px;
  font-size:14px;
}

#elanie .e2-shirt{
  fill:#39261f;
}

#elanie .e2-skirt{
  fill:#f8f4ef;
}

#elanie .e2-shoe{
  fill:#09090b;
}

#elanie .e2-text{
  fill:#fff;
  font-family:Georgia,serif;
  font-weight:bold;
  letter-spacing:2px;
  font-size:14px;
}

.fairy-dress{
  fill:#ef8fb3;
  stroke:#ffd5e3;
  stroke-width:2;
}

.fairy-wing{
  fill:#f9b9d1;
  opacity:.7;
  stroke:#ffd8e6;
  stroke-width:2;
}

.fairy-shoe{
  fill:#f8c6d8;
  stroke:#9e4667;
  stroke-width:2;
}

/* ---------------- SELECTORS ---------------- */

.selector-area{
  margin-top:18px;
  padding:18px;
  border-radius:24px;
  background:rgba(40,7,23,.78);
  border:1px solid rgba(255,174,200,.25);
}

.selector-title{
  text-align:center;
  color:#ffd4e2;
  font-size:21px;
  margin-bottom:13px;
}

.outfit-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.option{
  min-height:72px;
  border:1px solid #7f3654;
  background:#210a16;
  color:#f6cfda;
  border-radius:15px;
  padding:10px;
  transition:.2s;
}

.option:hover{
  transform:translateY(-2px);
  border-color:#df7598;
  background:#361025;
}

.option.selected{
  border-color:#ffadc5;
  background:#542039;
  box-shadow:0 0 18px rgba(255,120,160,.2);
}

.option strong{
  display:block;
  color:#ffdce7;
  margin-bottom:4px;
}

.option small{
  color:#c993a5;
  font-size:11px;
}

/* background selector */

.background-area{
  margin-top:14px;
  padding:18px;
  border-radius:24px;
  background:rgba(40,7,23,.78);
  border:1px solid rgba(255,174,200,.25);
}

.background-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.background-option{
  min-height:82px;
  border-radius:15px;
  border:1px solid #7f3654;
  color:#f7d3df;
  background:#210a16;
  padding:10px;
  transition:.2s;
}

.background-option:hover{
  transform:translateY(-2px);
  border-color:#df7598;
}

.background-option.selected{
  border-color:#ffadc5;
  background:#542039;
  box-shadow:0 0 18px rgba(255,120,160,.25);
}

.bg-preview{
  width:100%;
  height:32px;
  border-radius:8px;
  margin-bottom:8px;
}

.preview-castle{
  background:linear-gradient(135deg,#a03b60,#160711);
}

.preview-saturn{
  background:radial-gradient(circle at 65% 40%,#d59a72 0 10%,transparent 11%),#090914;
}

.preview-bedroom{
  background:linear-gradient(135deg,#71324d,#180915);
}

.preview-concert{
  background:radial-gradient(circle at 20% 40%,#ff4d91,transparent 20%),#09030d;
}

.ready-wrap{
  text-align:center;
  margin-top:16px;
}

.ready-btn{
  padding:14px 38px;
  border:none;
  border-radius:999px;
  background:linear-gradient(135deg,#df7096,#8d2a50);
  color:white;
  font-weight:bold;
  font-size:18px;
  box-shadow:0 0 25px rgba(223,112,150,.35);
}

.ready-btn:hover{
  transform:scale(1.04);
}

/* ---------------- CELEBRATION ---------------- */

.celebration{
  position:absolute;
  inset:0;
  z-index:20;
  pointer-events:none;
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0;
}

.celebration.show{
  animation:celebrate .8s forwards;
}

.celebration-text{
  text-align:center;
  font-size:clamp(28px,6vw,60px);
  font-style:italic;
  font-weight:bold;
  color:#fff1f6;
  text-shadow:
    0 0 10px #ff6f9e,
    0 0 35px #ff3f82;
}

.big-heart{
  position:absolute;
  font-size:70px;
  color:#ff9fbc;
  filter:drop-shadow(0 0 20px #ff4e8d);
  animation:heartUp 1.5s ease-out forwards;
}

.confetti{
  position:absolute;
  inset:0;
  overflow:hidden;
}

.confetti span{
  position:absolute;
  top:-20px;
  width:7px;
  height:15px;
  background:#ffadc7;
  animation:fall 2.4s linear forwards;
}

.confetti span:nth-child(2n){
  background:#c56a91;
}

.confetti span:nth-child(3n){
  background:#ffd7e4;
}

@keyframes celebrate{
  from{opacity:0;transform:scale(.7)}
  to{opacity:1;transform:scale(1)}
}

@keyframes heartUp{
  0%{
    transform:translateY(90px) scale(.3);
    opacity:0;
  }
  35%{
    opacity:1;
    transform:translateY(0) scale(1);
  }
  70%{
    transform:translateY(-80px) scale(1.2);
  }
  100%{
    transform:translateY(-150px) scale(2);
    opacity:0;
  }
}

@keyframes fall{
  to{
    transform:translateY(550px) rotate(500deg);
    opacity:0;
  }
}

/* final zoom */

.stage.final .character{
  transform:translateY(-20px) scale(1.07);
}

.stage.final{
  gap:45px;
}

/* responsive */

@media(max-width:900px){
  .stage{
    gap:15px;
    padding-left:5px;
    padding-right:5px;
  }

  .character{
    width:210px;
    flex-basis:210px;
  }

  .outfit-grid,
  .background-grid{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:620px){
  #gameScreen{
    padding:12px 9px 25px;
  }

  .game-header{
    align-items:flex-start;
  }

  .stage{
    min-height:470px;
    gap:0;
    padding:20px 0 0;
  }

  .character{
    width:180px;
    flex-basis:180px;
    height:430px;
  }

  .stage.final{
    gap:0;
  }

  .stage.final .character{
    transform:translateY(-15px) scale(1.03);
  }

  .logo{
    font-size:23px;
  }
}

@media(max-width:450px){
  .character{
    width:165px;
    flex-basis:165px;
  }

  .stage{
    min-height:430px;
  }

  .outfit-grid,
  .background-grid{
    grid-template-columns:1fr 1fr;
  }

  .option,
  .background-option{
    font-size:12px;
  }
}
</style>
</head>

<body>

<!-- PASSWORD -->

<section id="passwordScreen">

  <div class="password-box">

    <h1>Legendary Couple's Style</h1>

    <p>You know the password.</p>

    <input

<script>

const passwordScreen = document.getElementById("passwordScreen");
const introScreen = document.getElementById("introScreen");
const gameScreen = document.getElementById("gameScreen");

const passwordInput = document.getElementById("passwordInput");
const passwordError = document.getElementById("passwordError");

const enterButton = document.getElementById("enterButton");
const startButton = document.getElementById("startButton");

const burak = document.getElementById("burak");
const elanie = document.getElementById("elanie");

const backgroundArea = document.getElementById("backgroundArea");
const readyWrap = document.getElementById("readyWrap");

const stage = document.getElementById("stage");
const celebration = document.getElementById("celebration");
const confetti = document.getElementById("confetti");

const playAgain = document.getElementById("playAgain");

let burakSelected = false;
let elanieSelected = false;
let backgroundSelected = false;


/* PASSWORD */

function checkPassword(){

  if(passwordInput.value === "666"){

    passwordScreen.classList.add("hidden");
    introScreen.classList.remove("hidden");
    passwordError.textContent = "";

  }else{

    passwordError.textContent = "Wrong password.";

    passwordInput.value = "";

  }

}

enterButton.addEventListener("click",checkPassword);

passwordInput.addEventListener("keydown",function(e){

  if(e.key === "Enter"){
    checkPassword();
  }

});


/* START */

startButton.addEventListener("click",function(){

  introScreen.classList.add("hidden");
  gameScreen.classList.remove("hidden");

});


/* OUTFIT SELECTION */

document.querySelectorAll(".option").forEach(button => {

  button.addEventListener("click",function(){

    const character = this.dataset.character;
    const outfit = this.dataset.outfit;

    if(character === "burak"){

      burak.className = "character outfit-" + outfit;

      document
        .querySelectorAll('[data-character="burak"]')
        .forEach(btn => btn.classList.remove("selected"));

      this.classList.add("selected");

      burakSelected = true;

    }


    if(character === "elanie"){

      elanie.className = "character outfit-" + outfit;

      document
        .querySelectorAll('[data-character="elanie"]')
        .forEach(btn => btn.classList.remove("selected"));

      this.classList.add("selected");

      elanieSelected = true;

    }


    checkOutfits();

  });

});


/* CHECK BOTH */

function checkOutfits(){

  if(burakSelected && elanieSelected){

    backgroundArea.classList.remove("hidden");

  }

}


/* BACKGROUND */

document.querySelectorAll(".background-option").forEach(button => {

  button.addEventListener("click",function(){

    const bg = this.dataset.bg;

    stage.classList.remove(
      "castle",
      "saturn",
      "bedroom",
      "concert"
    );

    stage.classList.add(bg);

    document
      .querySelectorAll(".background-option")
      .forEach(btn => btn.classList.remove("selected"));

    this.classList.add("selected");

    backgroundSelected = true;

    if(backgroundSelected){

      readyWrap.classList.remove("hidden");

    }

  });

});


/* READY */

document.getElementById("readyButton").addEventListener("click",function(){

  document.getElementById("burakSelector").classList.add("hidden");
  document.getElementById("elanieSelector").classList.add("hidden");
  backgroundArea.classList.add("hidden");
  readyWrap.classList.add("hidden");

  stage.classList.add("final");

  createConfetti();

  celebration.classList.add("show");

  setTimeout(function(){

    celebration.classList.remove("show");

  },4000);

});


/* CONFETTI */

function createConfetti(){

  confetti.innerHTML = "";

  for(let i=0;i<90;i++){

    const piece = document.createElement("span");

    piece.style.left = Math.random()*100 + "%";

    piece.style.animationDelay =
      Math.random()*0.8 + "s";

    piece.style.transform =
      "rotate(" + Math.random()*360 + "deg)";

    confetti.appendChild(piece);

  }

}


/* PLAY AGAIN */

playAgain.addEventListener("click",function(){

  location.reload();

});

</script>
