<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Legendary Couple's Style</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    min-height:100%;
}

body{
    min-height:100vh;
    overflow-x:hidden;
    font-family:Georgia,"Times New Roman",serif;
    color:#ffe9f1;
    background:
        radial-gradient(circle at 50% 15%,#68263f 0%,#2c0b1c 43%,#10050d 100%);
}

button{
    font:inherit;
    cursor:pointer;
}

.hidden{
    display:none !important;
}


/* =========================================================
   PASSWORD
========================================================= */

#passwordScreen{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.password-box{
    width:min(440px,92vw);
    padding:42px 32px;
    text-align:center;
    border:1px solid rgba(255,190,210,.5);
    border-radius:25px;
    background:rgba(43,8,27,.86);
    box-shadow:
        0 0 45px rgba(255,90,145,.18),
        inset 0 0 35px rgba(255,160,190,.05);
    backdrop-filter:blur(12px);
}

.password-box h1{
    font-size:clamp(32px,7vw,55px);
    color:#ffd8e5;
    text-shadow:0 0 18px #d85c83;
    margin-bottom:12px;
}

.password-box p{
    color:#eeb3c6;
    margin-bottom:25px;
}

.password-input{
    width:100%;
    padding:15px;
    border:1px solid #b85a7b;
    border-radius:13px;
    outline:none;
    background:#190710;
    color:white;
    text-align:center;
    letter-spacing:10px;
    font-size:25px;
}

.enter-btn,
.main-btn{
    margin-top:18px;
    padding:13px 28px;
    border:1px solid #e68ca9;
    border-radius:999px;
    color:#fff0f5;
    background:linear-gradient(135deg,#8d274d,#54132d);
    box-shadow:0 0 20px rgba(230,110,150,.2);
    transition:.2s;
}

.enter-btn:hover,
.main-btn:hover{
    transform:translateY(-2px) scale(1.02);
    box-shadow:0 0 28px rgba(255,120,160,.4);
}

.error{
    height:20px;
    margin-top:12px;
    color:#ff8eae;
}


/* =========================================================
   INTRO / PLAY SCREEN
========================================================= */

#introScreen{
    min-height:100vh;
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 30%,rgba(133,36,72,.35),transparent 38%),
        radial-gradient(circle at 20% 70%,rgba(104,27,60,.2),transparent 25%),
        linear-gradient(145deg,#210915,#0c0309);
}

/* gothic decorative background */

.gothic-moon{
    position:absolute;
    width:260px;
    height:260px;
    border-radius:50%;
    right:7%;
    top:9%;
    background:rgba(255,190,210,.035);
    border:1px solid rgba(255,184,207,.13);
    box-shadow:
        0 0 80px rgba(255,100,150,.08),
        inset 0 0 50px rgba(255,150,180,.04);
}

.gothic-moon::after{
    content:"";
    position:absolute;
    width:220px;
    height:220px;
    border-radius:50%;
    left:-45px;
    top:-15px;
    background:#12050c;
}

.gothic-cross{
    position:absolute;
    color:#8e3658;
    opacity:.35;
    font-size:120px;
    line-height:1;
    text-shadow:0 0 25px #7d2348;
}

.cross-left{
    left:7%;
    top:14%;
}

.cross-right{
    right:11%;
    bottom:13%;
    font-size:80px;
}

.gothic-corner{
    position:absolute;
    width:130px;
    height:130px;
    border:1px solid rgba(217,102,143,.18);
}

.corner-one{
    left:25px;
    top:25px;
    border-right:0;
    border-bottom:0;
}

.corner-two{
    right:25px;
    bottom:25px;
    border-left:0;
    border-top:0;
}

.intro-content{
    position:relative;
    z-index:5;
    text-align:center;
}

.intro-title{
    font-size:clamp(42px,9vw,90px);
    color:#ffd6e3;
    font-style:italic;
    text-shadow:
        0 0 12px #ef759e,
        0 0 40px rgba(239,117,158,.5);
}

.intro-sub{
    margin:10px 0 28px;
    color:#d99bad;
    letter-spacing:4px;
    text-transform:uppercase;
    font-size:13px;
}

.intro-ornament{
    color:#b9577a;
    letter-spacing:14px;
    margin:13px 0;
    font-size:14px;
}

.intro-characters{
    display:flex;
    justify-content:center;
    align-items:end;
    gap:50px;
    margin-bottom:20px;
}

.intro-vampire,
.intro-fairy{
    position:relative;
    width:90px;
    height:130px;
}

.intro-vampire .head,
.intro-fairy .head{
    position:absolute;
    left:12px;
    top:15px;
    width:65px;
    height:65px;
    border-radius:50%;
    background:#f0c79f;
    border:2px solid #421021;
}

.intro-vampire .hair{
    position:absolute;
    left:6px;
    top:3px;
    width:76px;
    height:58px;
    border-radius:50% 50% 40% 40%;
    background:#21121c;
}

.intro-fairy .hair{
    position:absolute;
    left:5px;
    top:4px;
    width:78px;
    height:60px;
    border-radius:50% 50% 40% 40%;
    background:#7f2442;
}

.intro-vampire .body,
.intro-fairy .body{
    position:absolute;
    left:15px;
    top:75px;
    width:62px;
    height:58px;
    border-radius:25px 25px 8px 8px;
}

.intro-vampire .body{
    background:#190912;
    border:2px solid #a9486d;
}

.intro-fairy .body{
    background:#e986ac;
    border:2px solid #ffd0df;
}


/* =========================================================
   GAME
========================================================= */

#gameScreen{
    min-height:100vh;
    padding:18px 18px 35px;
}

.game-header{
    max-width:1200px;
    margin:0 auto 12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.logo{
    font-size:clamp(25px,5vw,43px);
    font-style:italic;
    color:#ffd4e1;
    text-shadow:0 0 18px rgba(255,110,155,.6);
}

.play-again{
    padding:9px 15px;
    border:1px solid #a64a6c;
    border-radius:999px;
    color:#f7c8d7;
    background:#260b18;
}

.game-area{
    max-width:1200px;
    margin:auto;
}


/* =========================================================
   STAGE
========================================================= */

.stage{
    position:relative;
    min-height:510px;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    gap:70px;
    padding:25px 40px 5px;
    overflow:hidden;
    border:1px solid rgba(255,180,205,.38);
    border-radius:30px;
    background:
        radial-gradient(circle at 50% 20%,rgba(255,170,195,.16),transparent 45%),
        linear-gradient(145deg,#351020,#160711);
    box-shadow:
        inset 0 0 70px rgba(0,0,0,.5),
        0 0 35px rgba(255,80,140,.1);
    transition:.6s;
}

.stage.castle{
    background:
        linear-gradient(rgba(15,4,12,.38),rgba(15,4,12,.65)),
        radial-gradient(circle at 50% 12%,#9d355b 0%,#3b1124 35%,#08040a 100%);
}

.stage.saturn{
    background:
        radial-gradient(circle at 70% 25%,#d08e64 0 5%,transparent 6%),
        radial-gradient(circle at 70% 25%,transparent 0 11%,rgba(238,194,151,.65) 11.5% 12.5%,transparent 13%),
        radial-gradient(circle at 20% 20%,#fff 0 1px,transparent 2px),
        radial-gradient(circle at 35% 60%,#fff 0 1px,transparent 2px),
        radial-gradient(circle at 85% 70%,#fff 0 1px,transparent 2px),
        radial-gradient(circle at 50% 80%,#fff 0 1px,transparent 2px),
        #090914;
}

.stage.bedroom{
    background:
        linear-gradient(rgba(30,8,25,.25),rgba(10,3,12,.7)),
        radial-gradient(circle at 50% 20%,#653044,#281225 60%,#10060f);
}

.stage.concert{
    background:
        radial-gradient(circle at 20% 30%,#ff3e86 0 2%,transparent 18%),
        radial-gradient(circle at 80% 25%,#8c4dff 0 2%,transparent 18%),
        radial-gradient(circle at 50% 15%,#fff 0 1%,transparent 9%),
        linear-gradient(#18061b,#08030c 70%);
}


/* =========================================================
   CHARACTERS
========================================================= */

.character{
    position:relative;
    width:250px;
    height:485px;
    flex:0 0 250px;
    z-index:3;
    transition:.7s ease;
}

.character svg{
    display:block;
    width:100%;
    height:100%;
    overflow:visible;
}


/*
============================================================
IMPORTANT OUTFIT SYSTEM

There is NO CSS display:none on .outfit.

JavaScript directly controls:
    outfit.style.display = "block";
or:
    outfit.style.display = "none";

This prevents the previous visibility conflict.
============================================================
*/

.outfit{
    opacity:1;
}

.default-clothes{
    opacity:1;
}


/* =========================================================
   BASIC BODY
========================================================= */

.skin{
    fill:#f1c9a4;
    stroke:#512536;
    stroke-width:2;
}

.burak-hair{
    fill:#24161c;
}

.elanie-hair{
    fill:#76213d;
}

.eye-white{
    fill:#fffafc;
    stroke:#4b2632;
    stroke-width:2;
}

.eye-pupil{
    fill:#5b321f;
}

.eye-shine{
    fill:white;
}

.brow{
    fill:none;
    stroke:#4b2930;
    stroke-width:4;
    stroke-linecap:round;
}

.blush{
    fill:#ed829b;
    opacity:.35;
}

.mouth{
    fill:none;
    stroke:#7a3148;
    stroke-width:3;
    stroke-linecap:round;
}


/* =========================================================
   BURAK OUTFITS
========================================================= */

.burak-black-shirt{
    fill:#0d0d10;
}

.burak-brown-shirt{
    fill:#39261f;
}

.burak-black-pants{
    fill:#111116;
}

.burak-black-shoes{
    fill:#09090b;
}

.brand-deftones{
    fill:white;
    font-family:Arial,sans-serif;
    font-weight:700;
    font-size:15px;
    letter-spacing:2px;
}

.brand-opeth{
    fill:white;
    font-family:Georgia,serif;
    font-weight:bold;
    font-size:15px;
    letter-spacing:2px;
}

.vampire-cape{
    fill:#641531;
}

.vampire-coat{
    fill:#21101a;
    stroke:#9c3b5f;
    stroke-width:2;
}

.vampire-shirt{
    fill:#eee0e5;
}

.vampire-pants{
    fill:#111116;
}

.vampire-shoes{
    fill:#08080a;
}

.pajama-pink{
    fill:#ef9bb9;
    stroke:#7c2947;
    stroke-width:2;
}

.pajama-heart{
    fill:#7e2143;
}


/* =========================================================
   ELANIE OUTFITS
========================================================= */

.elanie-black-shirt{
    fill:#0e0d10;
}

.elanie-brown-shirt{
    fill:#39261f;
}

.elanie-black-skirt{
    fill:#111116;
}

.elanie-white-skirt{
    fill:#f8f4ef;
}

.elanie-shoes{
    fill:#09090b;
}

.fairy-dress{
    fill:#ef8fb3;
    stroke:#ffd5e3;
    stroke-width:2;
}

.fairy-wing{
    fill:#f9b9d1;
    opacity:.72;
    stroke:#ffd8e6;
    stroke-width:2;
}

.fairy-shoe{
    fill:#f8c6d8;
    stroke:#9e4667;
    stroke-width:2;
}


/* =========================================================
   SELECTORS
========================================================= */

.selector-area,
.background-area{
    margin-top:18px;
    padding:18px;
    border:1px solid rgba(255,174,200,.25);
    border-radius:24px;
    background:rgba(40,7,23,.78);
}

.selector-title{
    margin-bottom:13px;
    color:#ffd4e2;
    text-align:center;
    font-size:21px;
}

.outfit-grid,
.background-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}

.option,
.background-option{
    min-height:78px;
    padding:10px;
    border:1px solid #7f3654;
    border-radius:15px;
    color:#f6cfda;
    background:#210a16;
    transition:.2s;
}

.option:hover,
.background-option:hover{
    transform:translateY(-2px);
    border-color:#df7598;
    background:#361025;
}

.option.selected,
.background-option.selected{
    border-color:#ffadc5;
    background:#542039;
    box-shadow:0 0 18px rgba(255,120,160,.2);
}

.option strong{
    display:block;
    margin-bottom:4px;
    color:#ffdce7;
}

.option small{
    color:#c993a5;
    font-size:11px;
}


/* =========================================================
   BACKGROUND OPTIONS
========================================================= */

.bg-preview{
    width:100%;
    height:32px;
    margin-bottom:8px;
    border-radius:8px;
}

.preview-castle{
    background:linear-gradient(135deg,#a03b60,#160711);
}

.preview-saturn{
    background:
        radial-gradient(circle at 65% 40%,#d59a72 0 10%,transparent 11%),
        #090914;
}

.preview-bedroom{
    background:linear-gradient(135deg,#71324d,#180915);
}

.preview-concert{
    background:
        radial-gradient(circle at 20% 40%,#ff4d91,transparent 20%),
        #09030d;
}


/* =========================================================
   READY
========================================================= */

.ready-wrap{
    margin-top:16px;
    text-align:center;
}

.ready-btn{
    padding:14px 38px;
    border:0;
    border-radius:999px;
    color:white;
    font-size:18px;
    font-weight:bold;
    background:linear-gradient(135deg,#df7096,#8d2a50);
    box-shadow:0 0 25px rgba(223,112,150,.35);
}

.ready-btn:hover{
    transform:scale(1.04);
}


/* =========================================================
   CELEBRATION
========================================================= */

.celebration{
    position:absolute;
    inset:0;
    z-index:20;
    pointer-events:none;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
}

.celebration.show{
    animation:celebrate .8s forwards;
}

.celebration-text{
    text-align:center;
    color:#fff1f6;
    font-size:clamp(28px,6vw,60px);
    font-style:italic;
    font-weight:bold;
    text-shadow:
        0 0 10px #ff6f9e,
        0 0 35px #ff3f82;
}

.big-heart{
    position:absolute;
    color:#ff9fbc;
    font-size:70px;
    filter:drop-shadow(0 0 20px #ff4e8d);
    animation:heartUp 1.5s ease-out forwards;
}

.confetti{
    position:absolute;
    inset:0;
    overflow:hidden;
}

.confetti span{
    position:absolute;
    top:-20px;
    width:7px;
    height:15px;
    background:#ffadc7;
    animation:fall 2.4s linear forwards;
}

.confetti span:nth-child(2n){
    background:#c56a91;
}

.confetti span:nth-child(3n){
    background:#ffd7e4;
}

@keyframes celebrate{
    from{
        opacity:0;
        transform:scale(.7);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

@keyframes heartUp{
    0%{
        transform:translateY(90px) scale(.3);
        opacity:0;
    }

    35%{
        opacity:1;
        transform:translateY(0) scale(1);
    }

    70%{
        transform:translateY(-80px) scale(1.2);
    }

    100%{
        transform:translateY(-150px) scale(2);
        opacity:0;
    }
}

@keyframes fall{
    to{
        transform:translateY(550px) rotate(500deg);
        opacity:0;
    }
}

.stage.final .character{
    transform:translateY(-20px) scale(1.07);
}

.stage.final{
    gap:45px;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:900px){

    .stage{
        gap:15px;
        padding-left:5px;
        padding-right:5px;
    }

    .character{
        width:210px;
        flex-basis:210px;
    }

    .outfit-grid,
    .background-grid{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:620px){

    #gameScreen{
        padding:12px 9px 25px;
    }

    .stage{
        min-height:470px;
        gap:0;
        padding:20px 0 0;
    }

    .character{
        width:180px;
        flex-basis:180px;
        height:430px;
    }

    .stage.final{
        gap:0;
    }

    .stage.final .character{
        transform:translateY(-15px) scale(1.03);
    }

    .logo{
        font-size:23px;
    }

    .gothic-moon{
        width:170px;
        height:170px;
    }

    .gothic-cross{
        font-size:80px;
    }
}

@media(max-width:450px){

    .character{
        width:165px;
        flex-basis:165px;
    }

    .stage{
        min-height:430px;
    }

    .outfit-grid,
    .background-grid{
        grid-template-columns:1fr 1fr;
    }

    .option,
    .background-option{
        font-size:12px;
    }

    .intro-characters{
        gap:25px;
    }
}
</style>
</head>

<body>

     PASSWORD SCREEN
===================================================== -->

        <div class="error" id="passwordError"></div>

            >
                ♥ Ready ♥
            </button>

        </div>

    </div>

</section>



<script>

/* =========================================================
   ELEMENTS
========================================================= */

const passwordScreen =
    document.getElementById("passwordScreen");

const introScreen =
    document.getElementById("introScreen");

const gameScreen =
    document.getElementById("gameScreen");

const passwordInput =
    document.getElementById("passwordInput");

const passwordError =
    document.getElementById("passwordError");

const enterButton =
    document.getElementById("enterButton");

const startButton =
    document.getElementById("startButton");

const burak =
    document.getElementById("burak");

const elanie =
    document.getElementById("elanie");

const stage =
    document.getElementById("stage");

const backgroundArea =
    document.getElementById("backgroundArea");

const readyWrap =
    document.getElementById("readyWrap");

const celebration =
    document.getElementById("celebration");

const confetti =
    document.getElementById("confetti");

const playAgain =
    document.getElementById("playAgain");

let burakSelected = false;
let elanieSelected = false;
let selectedBackground = null;


/* =========================================================
   PASSWORD
========================================================= */

function checkPassword(){

    if(passwordInput.value === "666"){

        passwordScreen.classList.add("hidden");

        introScreen.classList.remove("hidden");

        passwordError.textContent = "";

    }else{

        passwordError.textContent =
            "Wrong password.";

        passwordInput.value = "";

    }

}

enterButton.addEventListener(
    "click",
    checkPassword
);

passwordInput.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){
            checkPassword();
        }

    }
);


/* =========================================================
   START GAME
========================================================= */

startButton.addEventListener(
    "click",
    function(){

        introScreen.classList.add("hidden");

        gameScreen.classList.remove("hidden");

    }
);


/* =========================================================
   OUTFIT SYSTEM
========================================================= */

/*
    THIS IS THE FIX.

    Every character contains four independent SVG outfit groups.

    When the user clicks an outfit:

    1. Every outfit is hidden directly with style.display.
    2. Default shorts/shoes are hidden.
    3. The selected outfit gets style.display = "block".
    4. No CSS selector controls whether the outfit is visible.

    Therefore the selected clothes are actually rendered
    on top of the character body.
*/

function dressCharacter(character, outfitNumber){

    const allOutfits =
        character.querySelectorAll(".outfit");

    const defaultClothes =
        character.querySelectorAll(".default-clothes");


    /* Hide every outfit */

    allOutfits.forEach(function(outfit){

        outfit.style.display = "none";

    });


    /* Hide default shorts and shoes */

    defaultClothes.forEach(function(item){

        item.style.display = "none";

    });


    /*
        Determine the exact outfit group.
    */

    let selectedOutfit = null;

    if(character === burak){

        selectedOutfit =
            character.querySelector(
                ".outfit-burak-" + outfitNumber
            );

    }

    if(character === elanie){

        selectedOutfit =
            character.querySelector(
                ".outfit-elanie-" + outfitNumber
            );

    }


    /*
        Directly display the selected clothes.
    */

    if(selectedOutfit){

        selectedOutfit.style.display = "block";

    }

}


/* =========================================================
   OUTFIT BUTTONS
========================================================= */

document
    .querySelectorAll(".option")
    .forEach(function(button){

        button.addEventListener(
            "click",
            function(){

                const characterName =
                    this.dataset.character;

                const outfitNumber =
                    this.dataset.outfit;


                if(characterName === "burak"){

                    dressCharacter(
                        burak,
                        outfitNumber
                    );

                    burakSelected = true;


                    document
                        .querySelectorAll(
                            '[data-character="burak"]'
                        )
                        .forEach(function(btn){

                            btn.classList.remove(
                                "selected"
                            );

                        });

                    this.classList.add(
                        "selected"
                    );

                }


                if(characterName === "elanie"){

                    dressCharacter(
                        elanie,
                        outfitNumber
                    );

                    elanieSelected = true;


                    document
                        .querySelectorAll(
                            '[data-character="elanie"]'
                        )
                        .forEach(function(btn){

                            btn.classList.remove(
                                "selected"
                            );

                        });

                    this.classList.add(
                        "selected"
                    );

                }


                /*
                    Once both characters are dressed,
                    show background choices.
                */

                if(
                    burakSelected &&
                    elanieSelected
                ){

                    backgroundArea.classList.remove(
                        "hidden"
                    );

                }

            }
        );

    });


/* =========================================================
   BACKGROUND SYSTEM
========================================================= */

document
    .querySelectorAll(".background-option")
    .forEach(function(button){

        button.addEventListener(
            "click",
            function(){

                const bg =
                    this.dataset.bg;


                stage.classList.remove(
                    "castle",
                    "saturn",
                    "bedroom",
                    "concert"
                );


                stage.classList.add(bg);

                selectedBackground = bg;


                document
                    .querySelectorAll(
                        ".background-option"
                    )
                    .forEach(function(btn){

                        btn.classList.remove(
                            "selected"
                        );

                    });


                this.classList.add(
                    "selected"
                );


                if(selectedBackground){

                    readyWrap.classList.remove(
                        "hidden"
                    );

                }

            }
        );

    });


/* =========================================================
   READY
========================================================= */

document
    .getElementById("readyButton")
    .addEventListener(
        "click",
        function(){

            document
                .getElementById("burakSelector")
                .classList.add("hidden");

            document
                .getElementById("elanieSelector")
                .classList.add("hidden");

            backgroundArea.classList.add(
                "hidden"
            );

            readyWrap.classList.add(
                "hidden"
            );


            stage.classList.add(
                "final"
            );


            createConfetti();


            celebration.classList.add(
                "show"
            );


            setTimeout(
                function(){

                    celebration.classList.remove(
                        "show"
                    );

                },
                4000
            );

        }
    );


/* =========================================================
   CONFETTI
========================================================= */

function createConfetti(){

    confetti.innerHTML = "";

    for(let i = 0; i < 90; i++){

        const piece =
            document.createElement("span");

        piece.style.left =
            Math.random() * 100 + "%";

        piece.style.animationDelay =
            Math.random() * .8 + "s";

        piece.style.transform =
            "rotate(" +
            Math.random() * 360 +
            "deg)";

        confetti.appendChild(
            piece
        );

    }

}


/* =========================================================
   PLAY AGAIN
========================================================= */

playAgain.addEventListener(
    "click",
    function(){

        location.reload();

    }
);

</script>

</body>
</html>
